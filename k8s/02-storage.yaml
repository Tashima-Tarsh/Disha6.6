  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: disha-ai-models-pvc
  namespace: disha
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
