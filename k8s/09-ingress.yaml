apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: disha-ingress
  namespace: disha
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - disha.local
      secretName: disha-tls-cert
  rules:
    - host: disha.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: disha-web
                port:
                  number: 3000
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: disha-mcp-server
                port:
                  number: 4000
          - path: /openosint
            pathType: Prefix
            backend:
              service:
                name: disha-openosint
                port:
                  number: 8055
