apiVersion: v1
kind: ConfigMap
metadata:
  name: disha-config
  namespace: disha
data:
  NODE_ENV: "production"
  DISHA_AUTH_MODE: "password"
  DISHA_WEB_RATE_LIMIT: "240"
  DISHA_EVIDENCE_LEDGER_MODE: "postgres"
  DISHA_ALLOW_STATELESS_AUTH: "false"
  DISHA_BSA_SECTION_63_STRICT: "true"
  DISHA_AGENT_MODE: "deep"
  DISHA_MODEL_PROVIDER: "ollama"
  DISHA_MODEL_ROLE: "analysis"
  OLLAMA_BASE_URL: "http://disha-local-ai.disha.svc.cluster.local:11434/v1"
  OLLAMA_MODEL: "deepseek-r1:8b"
  DATABASE_URL: "postgresql://disha:disha_secure_k8s_password@disha-postgres.disha.svc.cluster.local:5432/disha"
  REDIS_URL: "redis://disha-redis.disha.svc.cluster.local:6379"
  OPENOSINT_SERVICE_TOKEN: "disha-openosint-k8s-token-secret"
  DISHA_BACKEND_URL: "http://disha-web.disha.svc.cluster.local:3000"
---
apiVersion: v1
kind: Secret
metadata:
  name: disha-secrets
  namespace: disha
type: Opaque
stringData:
  DISHA_JWT_SECRET: "disha-k8s-production-jwt-secret-min-32-chars-long-tamper-evident"
  DISHA_DEV_PASSWORD: "DishaMasterAdminProduction2026!"
  DISHA_WORKER_TOKEN: "disha-worker-token-production-2026-auth"
  POSTGRES_PASSWORD: "disha_secure_k8s_password"
