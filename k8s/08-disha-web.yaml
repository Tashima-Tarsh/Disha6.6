apiVersion: apps/v1
kind: Deployment
metadata:
  name: disha-web
  namespace: disha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: disha-web
  template:
    metadata:
      labels:
        app: disha-web
    spec:
      containers:
        - name: web
          image: disha-web:latest
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: disha-config
            - secretRef:
                name: disha-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: disha-web
  namespace: disha
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: disha-web
