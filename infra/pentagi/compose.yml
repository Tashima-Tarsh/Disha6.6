name: disha66-pentagi

services:
  pentagi:
    image: ${PENTAGI_IMAGE:?Run scripts/pentagi.ps1 install first}
    restart: unless-stopped
    user: pentagi
    group_add: ["0"]
    entrypoint: ["/opt/pentagi/bin/pentagi"]
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      DATABASE_URL: postgres://pentagi:${POSTGRES_PASSWORD:?Installation secret required}@pgvector:5432/pentagi?sslmode=disable
      COOKIE_SIGNING_SALT: ${COOKIE_SIGNING_SALT:?Installation secret required}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8443"
      SERVER_USE_SSL: "false"
      PUBLIC_URL: http://127.0.0.1:8443
      CORS_ORIGINS: http://127.0.0.1:8443,http://localhost:8443
      ASK_USER: "true"
      DEBUG: "false"
      OLLAMA_SERVER_URL: http://disha-local-ai:11434
      OLLAMA_SERVER_MODEL: qwen2.5:3b
      OLLAMA_SERVER_CONFIG_PATH: /opt/pentagi/conf/disha66.provider.yml
      OLLAMA_SERVER_PULL_MODELS_ENABLED: "false"
      OLLAMA_SERVER_LOAD_MODELS_ENABLED: "false"
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_URL: http://disha-local-ai:11434
      EMBEDDING_MODEL: nomic-embed-text
      EMBEDDING_BATCH_SIZE: "8"
      HTTP_CLIENT_TIMEOUT: "180"
      ASSISTANT_USE_AGENTS: "false"
      EXECUTION_MONITOR_ENABLED: "true"
      AGENT_PLANNING_STEP_ENABLED: "true"
      MAX_GENERAL_AGENT_TOOL_CALLS: "20"
      MAX_LIMITED_AGENT_TOOL_CALLS: "8"
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_INSIDE: "false"
      DOCKER_NET_ADMIN: "false"
      DOCKER_PUBLIC_IP: 127.0.0.1
      DOCKER_NETWORK: disha66-pentagi-workers
      DUCKDUCKGO_ENABLED: "true"
      SPLOITUS_ENABLED: "false"
      SCRAPER_PUBLIC_URL: https://scraper:${SCRAPER_PASSWORD:?Installation secret required}@scraper:443
      SCRAPER_PRIVATE_URL: https://scraper:${SCRAPER_PASSWORD}@scraper:443
      UPDATE_CHECK_INTERVAL: "0"
      GRAPHITI_ENABLED: "false"
    volumes:
      - ../../data/pentagi/app:/opt/pentagi/data
      - ./ollama.provider.yml:/opt/pentagi/conf/disha66.provider.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      pgvector:
        condition: service_healthy
      scraper:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8443/api/v1/info"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 90s
    mem_limit: 768m
    cpus: 1.5
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [default, models]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  pgvector:
    image: ${PGVECTOR_IMAGE:?Pinned database image required}
    restart: unless-stopped
    environment:
      POSTGRES_DB: pentagi
      POSTGRES_USER: pentagi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pentagi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pentagi -d pentagi"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  scraper:
    image: ${SCRAPER_IMAGE:?Pinned browser image required}
    restart: unless-stopped
    environment:
      MAX_CONCURRENT_SESSIONS: "1"
      USERNAME: scraper
      PASSWORD: ${SCRAPER_PASSWORD}
    volumes:
      - scraper-ssl:/usr/src/app/ssl
    shm_size: 256m
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  models:
    external: true
    name: disha66-pentagi-models

volumes:
  pentagi-postgres:
  scraper-ssl:
