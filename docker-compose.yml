services:
  osint-one:
    build: .
    ports: ["8000:8000"]
    restart: unless-stopped
    environment:
      - PORT=8000
  changedetection:
    image: dgtlmoon/changedetection.io
    ports: ["5000:5000"]
    volumes: ["./data/cd:/datastore"]
    restart: unless-stopped
  spiderfoot:
    image: smicallef/spiderfoot
    ports: ["5001:5001"]
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: osint
      POSTGRES_PASSWORD: osint
      POSTGRES_DB: osint
    volumes: ["./data/pg:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osint -d osint"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  ntfy:
    image: binwiederhier/ntfy
    command: serve
    ports: ["8080:8080"]
    restart: unless-stopped

  web-migrate:
    build:
      context: ./web
      dockerfile: Dockerfile
    command: ["node", "scripts/apply-schema.mjs"]
    environment:
      - DATABASE_URL=postgresql://osint:osint@postgres:5432/osint
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    volumes:
      # Local development provides the complete indexed instruction catalog.
      - ./.agents:/app/.agents:ro
    ports: ["3000:3000"]
    environment:
      - DATABASE_URL=postgresql://osint:osint@postgres:5432/osint
      - REDIS_URL=redis://redis:6379
      - DISHA_OSINT_BACKEND_URL=http://osint-one:8000
    restart: unless-stopped
    depends_on:
      web-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      osint-one:
        condition: service_started
