services:
  osint-one:
    build: .
    ports: ["8000:8000"]
    restart: unless-stopped
    environment:
      - PORT=8000
  changedetection:
    image: dgtlmoon/changedetection.io
    ports: ["5000:5000"]
    volumes: ["./data/cd:/datastore"]
    restart: unless-stopped
  spiderfoot:
    image: smicallef/spiderfoot
    ports: ["5001:5001"]
    restart: unless-stopped
  postgres:
    image: postgis/postgis
    environment:
      POSTGRES_USER: osint
      POSTGRES_PASSWORD: osint
      POSTGRES_DB: osint
    volumes: ["./data/pg:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    restart: unless-stopped
  ntfy:
    image: binwiederhier/ntfy
    command: serve
    ports: ["8080:8080"]
    restart: unless-stopped
