services:
  postgres:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    environment:
      POSTGRES_DB: disha
      POSTGRES_USER: disha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disha -d disha"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - disha_postgres:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - disha_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  disha-brain:
    profiles: ["full"]
    build:
      context: .
      dockerfile: disha/brain/Dockerfile
    environment:
      DISHA_BRAIN_API_HOST: 0.0.0.0
      DISHA_BRAIN_API_PORT: 8080
      DISHA_BRAIN_API_TOKEN: ${DISHA_BRAIN_API_TOKEN:-change-me}
      DISHA_WORKSPACE_ROOT: /workspace
      DISHA_ALLOWED_ORIGINS: http://localhost:3000
      DISHA_BRAIN_DB_PATH: /data/disha_brain.db
      DISHA_AI_PLATFORM_URL: ${DISHA_AI_PLATFORM_URL:-}
      DISHA_MCP_HTTP_URL: ${DISHA_MCP_HTTP_URL:-}
      DISHA_PHYSICS_URL: ${DISHA_PHYSICS_URL:-}
      DISHA_OPENCANARY_URL: ${DISHA_OPENCANARY_URL:-}
    volumes:
      - ./data:/data
      - ./:/workspace:ro
    ports:
      - "127.0.0.1:8000:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health').read(); print('ok')\""]
      interval: 15s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"

  web-migrate:
    build:
      context: ./web
      dockerfile: Dockerfile
    command: ["node", "scripts/apply-schema.mjs"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://disha:${POSTGRES_PASSWORD:-postgres}@postgres:5432/disha
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1001:1001"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      DISHA_AUTH_MODE: password
      DISHA_JWT_SECRET: ${DISHA_JWT_SECRET:-replace-with-at-least-32-random-characters}
      DISHA_WORKER_TOKEN: ${DISHA_WORKER_TOKEN:-replace-with-local-worker-token}
      DATABASE_URL: postgresql://disha:${POSTGRES_PASSWORD:-postgres}@postgres:5432/disha
      REDIS_URL: redis://redis:6379
      DISHA_WORKSPACE_ROOT: /workspace
      DISHA_ALLOWED_ORIGINS: ${DISHA_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      DISHA_ASTRA6_ALL_TOOLS_ENABLED: ${DISHA_ASTRA6_ALL_TOOLS_ENABLED:-true}
      DISHA_IDENTITY_ENUMERATION_APPROVED: ${DISHA_IDENTITY_ENUMERATION_APPROVED:-true}
      DISHA_ACTIVE_RECON_APPROVED: ${DISHA_ACTIVE_RECON_APPROVED:-false}
      # Optional research-layer connection. Available when running `--profile full`.
      DISHA_BRAIN_URL: ${DISHA_BRAIN_URL:-http://disha-brain:8080}
      DISHA_BRAIN_API_TOKEN: ${DISHA_BRAIN_API_TOKEN:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://127.0.0.1:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:3000}
      DISHA_EMBEDDING_PROVIDER: ${DISHA_EMBEDDING_PROVIDER:-local-hash}
      DISHA_EMBEDDING_MODEL: ${DISHA_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      DISHA_EMBEDDING_API_KEY: ${DISHA_EMBEDDING_API_KEY:-}
      DISHA_MODEL_PROVIDER: ${DISHA_MODEL_PROVIDER:-ollama}
      DISHA_MODEL_ROLE: ${DISHA_MODEL_ROLE:-analysis}
      DISHA_MODEL_TIMEOUT_MS: ${DISHA_MODEL_TIMEOUT_MS:-60000}
      DISHA_LOCAL_ONLY_MODE: ${DISHA_LOCAL_ONLY_MODE:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://disha-local-ai:11434/v1}
      OLLAMA_NATIVE_BASE_URL: ${OLLAMA_NATIVE_BASE_URL:-http://disha-local-ai:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_MAX_CONCURRENCY: ${OLLAMA_MAX_CONCURRENCY:-2}
      # Local OSINT platform handoffs running on the operator workstation.
      DFIR_IRIS_BASE_URL: ${DFIR_IRIS_BASE_URL:-https://host.docker.internal:18443}
      VELOCIRAPTOR_BASE_URL: ${VELOCIRAPTOR_BASE_URL:-http://host.docker.internal:32100}
      FLOWSINT_BASE_URL: ${FLOWSINT_BASE_URL:-http://host.docker.internal:5001}
      PENTAGI_BASE_URL: ${PENTAGI_BASE_URL:-http://host.docker.internal:8443}
      PENTAGI_PUBLIC_URL: ${PENTAGI_PUBLIC_URL:-http://127.0.0.1:8443}
      OPENOSINT_BASE_URL: ${OPENOSINT_BASE_URL:-http://openosint:8055}
      OPENOSINT_SERVICE_TOKEN: ${OPENOSINT_SERVICE_TOKEN:-disha-openosint-internal-token}
    volumes:
      - ./:/workspace:ro
    depends_on:
      web-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      disha-local-ai:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1001:1001"

  astra6-identity-worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infra/astra6-worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://disha:${POSTGRES_PASSWORD:-postgres}@postgres:5432/disha
      REDIS_URL: redis://redis:6379
      WORKER_CLASS: identity
      DISHA_WORKER_ID: astra6-identity-worker
      DISHA_ASTRA6_ALL_TOOLS_ENABLED: ${DISHA_ASTRA6_ALL_TOOLS_ENABLED:-true}
      DISHA_IDENTITY_ENUMERATION_APPROVED: ${DISHA_IDENTITY_ENUMERATION_APPROVED:-true}
    depends_on:
      web-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  astra6-infrastructure-worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infra/astra6-worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://disha:${POSTGRES_PASSWORD:-postgres}@postgres:5432/disha
      REDIS_URL: redis://redis:6379
      WORKER_CLASS: infrastructure
      DISHA_WORKER_ID: astra6-infrastructure-worker
      DISHA_ASTRA6_ALL_TOOLS_ENABLED: ${DISHA_ASTRA6_ALL_TOOLS_ENABLED:-true}
    depends_on:
      web-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  astra6-advanced-worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: infra/astra6-worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://disha:${POSTGRES_PASSWORD:-postgres}@postgres:5432/disha
      REDIS_URL: redis://redis:6379
      WORKER_CLASS: advanced
      DISHA_WORKER_ID: astra6-advanced-worker
      DISHA_ASTRA6_ALL_TOOLS_ENABLED: ${DISHA_ASTRA6_ALL_TOOLS_ENABLED:-true}
      DISHA_ACTIVE_RECON_APPROVED: ${DISHA_ACTIVE_RECON_APPROVED:-false}
    depends_on:
      web-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Optional modules (enable with: `docker compose --profile full up --build`)
  mcp-server:
    profiles: ["mcp"]
    build:
      context: ./disha/services/mcp
      dockerfile: Dockerfile
    environment:
      PORT: 4000
      DISHA_SRC_ROOT: /workspace
    volumes:
      - ./:/workspace:ro
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

  quantum-physics:
    profiles: ["physics"]
    build:
      context: ./disha/ai/physics/backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

  ai-platform:
    profiles: ["ai-platform"]
    build:
      context: ./disha/services/ai-platform
      dockerfile: docker/Dockerfile.backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-disha-secret-key-change-me}
      POSTGRES_URL: postgresql://disha:${POSTGRES_PASSWORD:-postgres}@postgres:5432/disha
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 10

  opencanary:
    profiles: ["honeypot"]
    build: ./disha/services/cyber/honeypot/opencanary
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:2121:21"
    volumes:
      - ./disha/services/cyber/logs/opencanary:/var/log/opencanary


  openosint:
    profiles: ["full", "osint"]
    build:
      context: .
      dockerfile: infra/openosint/Dockerfile
    environment:
      PORT: 8055
      OPENOSINT_BRIDGE_HOST: 0.0.0.0
      OPENOSINT_SERVICE_TOKEN: ${OPENOSINT_SERVICE_TOKEN:-disha-openosint-internal-token}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      HIBP_API_KEY: ${HIBP_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "127.0.0.1:8055:8055"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8055/health').read(); print('ok')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  disha-local-ai:
    image: ollama/ollama:latest
    container_name: disha-local-ai
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - disha_ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 12G

volumes:
  disha_postgres:
  disha_redis:
  disha_ollama_models:
