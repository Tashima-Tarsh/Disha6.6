name: Upstream Healthcheck Probe

on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes
  workflow_dispatch:

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Live Healthcheck Probe
        run: python -m live.healthcheck

      - name: Commit Updated health.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update live upstream health status"
          file_pattern: "index/health.json"

