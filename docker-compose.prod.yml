name: disha-production

services:
  postgres:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    image: disha-postgres:pg16-vector-postgis
    environment:
      POSTGRES_DB: disha
      POSTGRES_USER: disha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set-postgres-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disha -d disha"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  embeddings:
    image: ${DISHA_IMAGE_REGISTRY:-ghcr.io/tashima-tarsh/disha}/embeddings:${DISHA_IMAGE_TAG:-latest}
    environment:
      DISHA_EMBEDDING_MODEL: ${DISHA_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      DISHA_EMBEDDING_DIMENSIONS: ${DISHA_EMBEDDING_DIMENSIONS:-384}
    volumes:
      - embedding_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  disha-brain:
    image: ${DISHA_IMAGE_REGISTRY:-ghcr.io/tashima-tarsh/disha}/brain:${DISHA_IMAGE_TAG:-latest}
    environment:
      DISHA_BRAIN_API_HOST: 0.0.0.0
      DISHA_BRAIN_API_PORT: 8080
      DISHA_BRAIN_API_TOKEN: ${DISHA_BRAIN_API_TOKEN:?set-in-production-environment}
      DISHA_BRAIN_DB_PATH: /data/disha_brain.db
      DISHA_ALLOWED_ORIGINS: ${DISHA_ALLOWED_ORIGINS:?set-in-production-environment}
    volumes:
      - disha_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=5).read()\""]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web-migrate:
    image: ${DISHA_IMAGE_REGISTRY:-ghcr.io/tashima-tarsh/disha}/web:${DISHA_IMAGE_TAG:-latest}
    command: ["node", "scripts/apply-schema.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://disha:${POSTGRES_PASSWORD:?set-postgres-password}@postgres:5432/disha
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    image: ${DISHA_IMAGE_REGISTRY:-ghcr.io/tashima-tarsh/disha}/web:${DISHA_IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      DISHA_AUTH_MODE: oidc
      DISHA_JWT_SECRET: ${DISHA_JWT_SECRET:?set-in-production-environment}
      DISHA_OIDC_ISSUER: ${DISHA_OIDC_ISSUER:-}
      DISHA_OIDC_CLIENT_ID: ${DISHA_OIDC_CLIENT_ID:-}
      DISHA_OIDC_CLIENT_SECRET: ${DISHA_OIDC_CLIENT_SECRET:-}
      DISHA_OIDC_REDIRECT_URI: ${DISHA_OIDC_REDIRECT_URI:-}
      DATABASE_URL: postgresql://disha:${POSTGRES_PASSWORD:?set-postgres-password}@postgres:5432/disha
      REDIS_URL: redis://redis:6379
      DISHA_ALLOWED_ORIGINS: ${DISHA_ALLOWED_ORIGINS:?set-in-production-environment}
      NEXT_PUBLIC_APP_URL: ${DISHA_PRODUCTION_URL:?set-production-url}
      DISHA_BRAIN_URL: http://disha-brain:8080
      DISHA_BRAIN_API_TOKEN: ${DISHA_BRAIN_API_TOKEN:?set-in-production-environment}
      DISHA_RESEARCH_RUNTIME_URL: http://disha-brain:8080
      DISHA_RESEARCH_RUNTIME_TOKEN: ${DISHA_RESEARCH_RUNTIME_TOKEN:?set-in-production-environment}
      DISHA_WORKER_TOKEN: ${DISHA_WORKER_TOKEN:?set-in-production-environment}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      DISHA_MODEL_ROUTES_JSON: ${DISHA_MODEL_ROUTES_JSON:-}
      DISHA_EMBEDDING_PROVIDER: openai-compatible
      DISHA_EMBEDDING_BASE_URL: http://embeddings:8081/v1
      DISHA_EMBEDDING_MODEL: ${DISHA_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      DISHA_EMBEDDING_TIMEOUT_MS: ${DISHA_EMBEDDING_TIMEOUT_MS:-5000}
      DISHA_EMBEDDING_API_KEY: ""
    depends_on:
      web-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      embeddings:
        condition: service_healthy
      disha-brain:
        condition: service_healthy
    ports:
      - "${DISHA_HTTP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  dynamic-worker:
    image: ${DISHA_IMAGE_REGISTRY:-ghcr.io/tashima-tarsh/disha}/web:${DISHA_IMAGE_TAG:-latest}
    command: ["node", "scripts/dynamic-worker.mjs"]
    environment:
      NODE_ENV: production
      DISHA_INTERNAL_WEB_URL: http://web:3000
      DISHA_WORKER_TOKEN: ${DISHA_WORKER_TOKEN:?set-in-production-environment}
      DISHA_SCHEDULER_POLL_SECONDS: ${DISHA_SCHEDULER_POLL_SECONDS:-30}
      DISHA_SCHEDULER_MAX_JOBS: ${DISHA_SCHEDULER_MAX_JOBS:-10}
      DISHA_WORKFLOW_MAX_JOBS: ${DISHA_WORKFLOW_MAX_JOBS:-10}
      DISHA_WORKFLOW_LEASE_SECONDS: ${DISHA_WORKFLOW_LEASE_SECONDS:-120}
      DISHA_WORKER_ID: ${DISHA_WORKER_ID:-github-production-worker-1}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
  redis_data:
  disha_data:
  embedding_models:
