name: disha-production

services:
  postgres:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    image: disha-postgres:pg16-vector-postgis
    environment:
      POSTGRES_DB: disha
      POSTGRES_USER: disha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set-postgres-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disha -d disha"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  embeddings:
    image: ${DISHA_IMAGE_REGISTRY:-ghcr.io/tashima-tarsh}/disha-embeddings:${DISHA_IMAGE_TAG:-latest}
    environment:
      DISHA_EMBEDDING_MODEL: ${DISHA_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      DISHA_EMBEDDING_DIMENSIONS: ${DISHA_EMBEDDING_DIMENSIONS:-384}
    volumes:
      - embedding_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  disha-brain:
    image: ${DISHA_IMAGE_REGISTRY:-ghcr.io/tashima-tarsh}/disha-brain:${DISHA_IMAGE_TAG:-latest}
    environment:
      DISHA_BRAIN_API_HOST: 0.0.0.0
      DISHA_BRAIN_API_PORT: 8080
      DISHA_BRAIN_API_TOKEN: ${DISHA_BRAIN_API_TOKEN:?set-in-production-environment}
      DISHA_BRAIN_DB_PATH: /data/disha_brain.db
      DISHA_ALLOWED_ORIGINS: ${DISHA_ALLOWED_ORIGINS:?set-in-production-environment}
    volumes:
      - disha_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=5).read()\""]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web-migrate:
    image: ${DISHA_IMAGE_REGISTRY:-ghcr.io/tashima-tarsh}/disha-web:${DISHA_IMAGE_TAG:-latest}
    command: ["node", "scripts/apply-schema.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://disha:${POSTGRES_PASSWORD:?set-postgres-password}@postgres:5432/disha
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  osint-backend:
    image: ${DISHA_IMAGE_REGISTRY:-ghcr.io/tashima-tarsh}/disha-osint-backend:${DISHA_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 8000
      DISHA_OSINT_API_KEY: ${DISHA_OSINT_API_KEY:-${DISHA_WORKER_TOKEN}}
      DISHA_WORKSPACE_ROOT: /data/workspace
    volumes:
      - osint_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/tools/status', timeout=5).read()\""]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  web:
    image: ${DISHA_IMAGE_REGISTRY:-ghcr.io/tashima-tarsh}/disha-web:${DISHA_IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      DISHA_OSINT_BACKEND_URL: http://osint-backend:8000
      NEXT_PUBLIC_OSINT_BACKEND: http://osint-backend:8000
      DISHA_AUTH_MODE: ${DISHA_AUTH_MODE:-hybrid}
      DISHA_JWT_SECRET: ${DISHA_JWT_SECRET:?set-in-production-environment}
      DISHA_OIDC_REDIRECT_URI: ${DISHA_OIDC_REDIRECT_URI:-}
      DISHA_MERI_PEHCHAN_AUTH_URL: ${DISHA_MERI_PEHCHAN_AUTH_URL:-https://digilocker.meripehchaan.gov.in/public/oauth2/1/authorize}
      DISHA_MERI_PEHCHAN_TOKEN_URL: ${DISHA_MERI_PEHCHAN_TOKEN_URL:-https://digilocker.meripehchaan.gov.in/public/oauth2/2/token}
      DISHA_MERI_PEHCHAN_USER_URL: ${DISHA_MERI_PEHCHAN_USER_URL:-https://digilocker.meripehchaan.gov.in/public/oauth2/1/user}
      DISHA_MERI_PEHCHAN_CLIENT_ID: ${DISHA_MERI_PEHCHAN_CLIENT_ID:-}
      DISHA_MERI_PEHCHAN_CLIENT_SECRET: ${DISHA_MERI_PEHCHAN_CLIENT_SECRET:-}
      DISHA_MERI_PEHCHAN_REDIRECT_URI: ${DISHA_MERI_PEHCHAN_REDIRECT_URI:-}
      DATABASE_URL: postgresql://disha:${POSTGRES_PASSWORD:?set-postgres-password}@postgres:5432/disha
      REDIS_URL: redis://redis:6379
      DISHA_ALLOWED_ORIGINS: ${DISHA_ALLOWED_ORIGINS:?set-in-production-environment}
      NEXT_PUBLIC_APP_URL: ${DISHA_PRODUCTION_URL:?set-production-url}
      DISHA_BRAIN_URL: http://disha-brain:8080
      DISHA_BRAIN_API_TOKEN: ${DISHA_BRAIN_API_TOKEN:?set-in-production-environment}
      DISHA_RESEARCH_RUNTIME_URL: http://disha-brain:8080
      DISHA_RESEARCH_RUNTIME_TOKEN: ${DISHA_RESEARCH_RUNTIME_TOKEN:?set-in-production-environment}
      DISHA_WORKER_TOKEN: ${DISHA_WORKER_TOKEN:?set-in-production-environment}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      DISHA_MODEL_ROUTES_JSON: ${DISHA_MODEL_ROUTES_JSON:-}
      DISHA_MODEL_PROVIDER: ${DISHA_MODEL_PROVIDER:-ollama}
      DISHA_MODEL_ROLE: ${DISHA_MODEL_ROLE:-analysis}
      DISHA_MODEL_TIMEOUT_MS: ${DISHA_MODEL_TIMEOUT_MS:-20000}
      DISHA_LOCAL_ONLY_MODE: ${DISHA_LOCAL_ONLY_MODE:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://disha-local-ai:11434/v1}
      OLLAMA_NATIVE_BASE_URL: ${OLLAMA_NATIVE_BASE_URL:-http://disha-local-ai:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_MAX_CONCURRENCY: ${OLLAMA_MAX_CONCURRENCY:-2}
      PENTAGI_BASE_URL: ${PENTAGI_BASE_URL:-http://host.docker.internal:8443}
      PENTAGI_PUBLIC_URL: ${PENTAGI_PUBLIC_URL:-http://127.0.0.1:8443}
      DISHA_EMBEDDING_PROVIDER: openai-compatible
      DISHA_EMBEDDING_BASE_URL: http://embeddings:8081/v1
      DISHA_EMBEDDING_MODEL: ${DISHA_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      DISHA_EMBEDDING_TIMEOUT_MS: ${DISHA_EMBEDDING_TIMEOUT_MS:-5000}
      DISHA_EMBEDDING_API_KEY: ""
      OPENCTI_BASE_URL: ${OPENCTI_BASE_URL:-}
      OPENCTI_TOKEN: ${OPENCTI_TOKEN:-}
      INTELOWL_BASE_URL: ${INTELOWL_BASE_URL:-}
      INTELOWL_API_KEY: ${INTELOWL_API_KEY:-}
      INTELOWL_ANALYZERS_ALLOWLIST: ${INTELOWL_ANALYZERS_ALLOWLIST:-${INTELOWL_ANALYZERS:-}}
      INTELOWL_ANALYZERS: ${INTELOWL_ANALYZERS:-${INTELOWL_ANALYZERS_ALLOWLIST:-}}
      INTELOWL_JOB_TIMEOUT_MS: ${INTELOWL_JOB_TIMEOUT_MS:-15000}
      DFIR_IRIS_BASE_URL: ${DFIR_IRIS_BASE_URL:-}
      VELOCIRAPTOR_BASE_URL: ${VELOCIRAPTOR_BASE_URL:-}
      FLOWSINT_BASE_URL: ${FLOWSINT_BASE_URL:-}
      DISHA_ASTRA6_ALL_TOOLS_ENABLED: ${DISHA_ASTRA6_ALL_TOOLS_ENABLED:-false}
      DISHA_ASTRA6_SHERLOCK_ENABLED: ${DISHA_ASTRA6_SHERLOCK_ENABLED:-false}
      DISHA_ASTRA6_MAIGRET_ENABLED: ${DISHA_ASTRA6_MAIGRET_ENABLED:-false}
      DISHA_ASTRA6_HOLEHE_ENABLED: ${DISHA_ASTRA6_HOLEHE_ENABLED:-false}
      DISHA_ASTRA6_PHONEINFOGA_ENABLED: ${DISHA_ASTRA6_PHONEINFOGA_ENABLED:-false}
      DISHA_ASTRA6_INSTALOADER_ENABLED: ${DISHA_ASTRA6_INSTALOADER_ENABLED:-false}
      DISHA_ASTRA6_TELEGRAM_PUBLIC_ENABLED: ${DISHA_ASTRA6_TELEGRAM_PUBLIC_ENABLED:-false}
      DISHA_ASTRA6_THEHARVESTER_ENABLED: ${DISHA_ASTRA6_THEHARVESTER_ENABLED:-false}
      DISHA_ASTRA6_OWASP_AMASS_ENABLED: ${DISHA_ASTRA6_OWASP_AMASS_ENABLED:-false}
      DISHA_ASTRA6_SUBFINDER_ENABLED: ${DISHA_ASTRA6_SUBFINDER_ENABLED:-false}
      DISHA_ASTRA6_SPIDERFOOT_ENABLED: ${DISHA_ASTRA6_SPIDERFOOT_ENABLED:-false}
      DISHA_ASTRA6_RECON_NG_ENABLED: ${DISHA_ASTRA6_RECON_NG_ENABLED:-false}
      DISHA_ASTRA6_PHOTON_ENABLED: ${DISHA_ASTRA6_PHOTON_ENABLED:-false}
      DISHA_IDENTITY_ENUMERATION_APPROVED: ${DISHA_IDENTITY_ENUMERATION_APPROVED:-false}
      DISHA_ACTIVE_RECON_APPROVED: ${DISHA_ACTIVE_RECON_APPROVED:-false}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION: ${TELEGRAM_SESSION:-}
      OPENOSINT_BASE_URL: ${OPENOSINT_BASE_URL:-http://openosint:8055}
      OPENOSINT_SERVICE_TOKEN: ${OPENOSINT_SERVICE_TOKEN:-}
    depends_on:
      web-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      embeddings:
        condition: service_healthy
      osint-backend:
        condition: service_healthy
      disha-brain:
        condition: service_healthy
      disha-local-ai:
        condition: service_healthy
    ports:
      - "${DISHA_HTTP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  astra6-identity-worker:
    build:
      context: .
      dockerfile: infra/workers/Dockerfile.identity
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://disha:${POSTGRES_PASSWORD:?set-postgres-password}@postgres:5432/disha
      REDIS_URL: redis://redis:6379
      DISHA_WORKER_ID: ${DISHA_IDENTITY_WORKER_ID:-astra6-identity-worker-1}
      DISHA_OSINT_POLL_MS: ${DISHA_OSINT_POLL_MS:-1000}
      DISHA_ASTRA6_ALL_TOOLS_ENABLED: ${DISHA_ASTRA6_ALL_TOOLS_ENABLED:-false}
      DISHA_ASTRA6_PHONEINFOGA_ENABLED: ${DISHA_ASTRA6_PHONEINFOGA_ENABLED:-false}
      DISHA_ASTRA6_SHERLOCK_ENABLED: ${DISHA_ASTRA6_SHERLOCK_ENABLED:-false}
      DISHA_ASTRA6_MAIGRET_ENABLED: ${DISHA_ASTRA6_MAIGRET_ENABLED:-false}
      DISHA_ASTRA6_HOLEHE_ENABLED: ${DISHA_ASTRA6_HOLEHE_ENABLED:-false}
      DISHA_ASTRA6_INSTALOADER_ENABLED: ${DISHA_ASTRA6_INSTALOADER_ENABLED:-false}
      DISHA_ASTRA6_TELEGRAM_PUBLIC_ENABLED: ${DISHA_ASTRA6_TELEGRAM_PUBLIC_ENABLED:-false}
      DISHA_IDENTITY_ENUMERATION_APPROVED: ${DISHA_IDENTITY_ENUMERATION_APPROVED:-false}
      WORKER_CLASS: identity
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_SESSION: ${TELEGRAM_SESSION:-}
      INSTAGRAM_LOGIN: ${INSTAGRAM_LOGIN:-}
      INSTAGRAM_SESSION_FILE: ${INSTAGRAM_SESSION_FILE:-}
      DISHA_MAIGRET_TOP_SITES: ${DISHA_MAIGRET_TOP_SITES:-300}
      DISHA_HOLEHE_TIMEOUT_SECONDS: ${DISHA_HOLEHE_TIMEOUT_SECONDS:-8}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  astra6-infrastructure-worker:
    build:
      context: .
      dockerfile: infra/workers/Dockerfile.infrastructure
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://disha:${POSTGRES_PASSWORD:?set-postgres-password}@postgres:5432/disha
      REDIS_URL: redis://redis:6379
      DISHA_WORKER_ID: ${DISHA_INFRA_WORKER_ID:-astra6-infrastructure-worker-1}
      DISHA_OSINT_POLL_MS: ${DISHA_OSINT_POLL_MS:-1000}
      DISHA_ASTRA6_ALL_TOOLS_ENABLED: ${DISHA_ASTRA6_ALL_TOOLS_ENABLED:-false}
      DISHA_ASTRA6_THEHARVESTER_ENABLED: ${DISHA_ASTRA6_THEHARVESTER_ENABLED:-false}
      DISHA_ASTRA6_OWASP_AMASS_ENABLED: ${DISHA_ASTRA6_OWASP_AMASS_ENABLED:-false}
      DISHA_ASTRA6_SUBFINDER_ENABLED: ${DISHA_ASTRA6_SUBFINDER_ENABLED:-false}
      WORKER_CLASS: infrastructure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  astra6-advanced-worker:
    build:
      context: .
      dockerfile: infra/workers/Dockerfile.research-osint
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://disha:${POSTGRES_PASSWORD:?set-postgres-password}@postgres:5432/disha
      REDIS_URL: redis://redis:6379
      DISHA_WORKER_ID: ${DISHA_ADVANCED_WORKER_ID:-astra6-advanced-worker-1}
      DISHA_OSINT_POLL_MS: ${DISHA_OSINT_POLL_MS:-1000}
      DISHA_ASTRA6_ALL_TOOLS_ENABLED: ${DISHA_ASTRA6_ALL_TOOLS_ENABLED:-false}
      DISHA_ASTRA6_SPIDERFOOT_ENABLED: ${DISHA_ASTRA6_SPIDERFOOT_ENABLED:-false}
      DISHA_ASTRA6_RECON_NG_ENABLED: ${DISHA_ASTRA6_RECON_NG_ENABLED:-false}
      DISHA_ASTRA6_PHOTON_ENABLED: ${DISHA_ASTRA6_PHOTON_ENABLED:-false}
      DISHA_ACTIVE_RECON_APPROVED: ${DISHA_ACTIVE_RECON_APPROVED:-false}
      WORKER_CLASS: advanced
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/spiderfoot
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  dynamic-worker:
    image: ${DISHA_IMAGE_REGISTRY:-ghcr.io/tashima-tarsh}/disha-web:${DISHA_IMAGE_TAG:-latest}
    command: ["node", "scripts/dynamic-worker.mjs"]
    environment:
      NODE_ENV: production
      DISHA_INTERNAL_WEB_URL: http://web:3000
      DISHA_WORKER_TOKEN: ${DISHA_WORKER_TOKEN:?set-in-production-environment}
      DISHA_SCHEDULER_POLL_SECONDS: ${DISHA_SCHEDULER_POLL_SECONDS:-30}
      DISHA_SCHEDULER_MAX_JOBS: ${DISHA_SCHEDULER_MAX_JOBS:-10}
      DISHA_WORKFLOW_MAX_JOBS: ${DISHA_WORKFLOW_MAX_JOBS:-10}
      DISHA_WORKFLOW_LEASE_SECONDS: ${DISHA_WORKFLOW_LEASE_SECONDS:-120}
      DISHA_WORKER_ID: ${DISHA_WORKER_ID:-github-production-worker-1}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL


  openosint:
    build:
      context: .
      dockerfile: infra/openosint/Dockerfile
    image: ${DISHA_IMAGE_REGISTRY:-ghcr.io/tashima-tarsh}/disha-openosint:${DISHA_IMAGE_TAG:-latest}
    environment:
      PORT: 8055
      OPENOSINT_SERVICE_TOKEN: ${OPENOSINT_SERVICE_TOKEN:?set-openosint-service-token}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      HIBP_API_KEY: ${HIBP_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      HUNTER_API_KEY: ${HUNTER_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8055/health').read(); print('ok')\""]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  disha-local-ai:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  disha_data:
  osint_data:
  embedding_models:
  ollama_models:
