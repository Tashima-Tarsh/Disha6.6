name: disha6.6 Product Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: disha-product-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build and publish ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile
          - name: brain
            context: .
            dockerfile: ./disha/brain/Dockerfile
          - name: embeddings
            context: ./disha/embeddings
            dockerfile: ./disha/embeddings/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/disha-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/disha-${{ matrix.name }}:${{ github.sha }}