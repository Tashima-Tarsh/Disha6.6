name: disha6.6 Product Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: disha-product-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gatekeeper:
    name: Release Gatekeeper (Tests, Typecheck, Constitutional Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit & regression tests
        run: npm test
      - name: Typecheck
        run: npm run type-check
      - name: Verify bundled agents
        run: |
          test -d .agents/roles || exit 1
          test -d .agents/skills || exit 1

  images:
    name: Build and publish ${{ matrix.name }} image
    needs: [gatekeeper]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile
          - name: osint-backend
            context: .
            dockerfile: ./Dockerfile
          - name: brain
            context: .
            dockerfile: ./disha/brain/Dockerfile
          - name: embeddings
            context: ./disha/embeddings
            dockerfile: ./disha/embeddings/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - name: Bundle root agents into web context
        if: matrix.name == 'web'
        run: |
          mkdir -p web/.agents
          cp -r .agents/* web/.agents/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/disha-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/disha-${{ matrix.name }}:${{ github.sha }}
