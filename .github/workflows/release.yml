name: disha6.6 Product Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: disha-product-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gatekeeper:
    name: Release Gatekeeper (Tests, Typecheck, Constitutional Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: OSINT worker syntax
        run: node --check scripts/astra6-worker.mjs
      - name: Lint
        run: npm run lint
      - name: Run unit & regression tests
        run: npm test
      - name: Full typecheck
        run: npm run type-check:full
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Governance and security scan
        working-directory: .
        env:
          BASE_SHA: ${{ github.sha }}
          EVENT_NAME: workflow_dispatch
        run: node scripts/governance-check.mjs
      - name: Verify bundled agents
        run: |
          test -d ../.agents/roles
          test -d ../.agents/skills
      - name: Build
        env:
          NODE_ENV: production
          DISHA_AUTH_MODE: password
          DISHA_JWT_SECRET: test-secret-at-least-32-characters-long
          DISHA_DEV_PASSWORD: test-dev-password-12-plus
          DISHA_WORKER_TOKEN: test-worker-token-at-least-24
          DISHA_ALLOW_STATELESS_AUTH: "true"
          DISHA_BRAIN_URL: http://localhost:8080
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build

  images:
    name: Build and publish ${{ matrix.name }} image
    needs: [gatekeeper]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile
          - name: osint-backend
            context: .
            dockerfile: ./Dockerfile
          - name: brain
            context: .
            dockerfile: ./disha/brain/Dockerfile
          - name: embeddings
            context: ./disha/embeddings
            dockerfile: ./disha/embeddings/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - name: Bundle root agents into web context
        if: matrix.name == 'web'
        run: |
          mkdir -p web/.agents
          cp -r .agents/* web/.agents/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/disha-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/disha-${{ matrix.name }}:${{ github.sha }}
