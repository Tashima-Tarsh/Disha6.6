name: disha6.6 Product Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: disha-product-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-web:
    uses: ./.github/workflows/ci.yml
  verify-python:
    uses: ./.github/workflows/python-core.yml
  verify-database:
    uses: ./.github/workflows/db-migrations.yml
  verify-security:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
  images:
    needs: [verify-web, verify-python, verify-database, verify-security]
    name: Build and publish ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile
          - name: brain
            context: .
            dockerfile: ./disha/brain/Dockerfile
          - name: embeddings
            context: ./disha/embeddings
            dockerfile: ./disha/embeddings/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - name: Normalize image owner
        id: registry
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: echo "owner=${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.registry.outputs.owner }}/disha-${{ matrix.name }}:latest
            ghcr.io/${{ steps.registry.outputs.owner }}/disha-${{ matrix.name }}:${{ github.sha }}
