name: disha6.6 Python Core

on:
  push:
    branches: [main]
    paths:
      - "disha/brain/**"
      - "disha/contracts/**"
      - "skills/vyuha-defense-engine/**"
      - "tests/test_disha_brain_graph.py"
      - "tests/test_disha_contracts.py"
      - "pyproject.toml"
      - "disha/brain/requirements.txt"
      - ".github/workflows/python-core.yml"
  pull_request:
    branches: [main]
    paths:
      - "disha/brain/**"
      - "disha/contracts/**"
      - "skills/vyuha-defense-engine/**"
      - "tests/test_disha_brain_graph.py"
      - "tests/test_disha_contracts.py"
      - "pyproject.toml"
      - "disha/brain/requirements.txt"
      - ".github/workflows/python-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disha-python-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Brain, contracts, and governed defensive source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: disha/brain/requirements.txt

      - name: Install active Python runtime
        run: python -m pip install -r disha/brain/requirements.txt pytest

      - name: Verify Brain, canonical contracts, and governed defensive source
        run: python -m pytest tests/test_disha_brain_graph.py tests/test_disha_contracts.py skills/vyuha-defense-engine/tests
