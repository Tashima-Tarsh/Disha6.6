name: disha6.6 Custom Domain Smoke

on:
  workflow_run:
    workflows: ["disha6.6 Cloudflare Edge Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: disha-custom-domain-smoke
  cancel-in-progress: true
jobs:
  edge:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify domain, readiness, assets and unauthenticated boundaries
        env:
          DISHA_PUBLIC_URL: https://disha6.6.thenitishkr.in
        run: node web/scripts/smoke-production.mjs
