name: disha6.6 Custom Domain Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disha-custom-domain-smoke
  cancel-in-progress: true

jobs:
  edge:
    name: Verify public custom domain
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Cloudflare edge deployment
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 30); do
            rm -f /tmp/disha-headers /tmp/disha-body
            code="$(curl -sS --connect-timeout 10 --max-time 20               -D /tmp/disha-headers -o /tmp/disha-body               -w '%{http_code}'               https://disha6.6.thenitishkr.in/login || true)"
            if [[ "$code" == "200" ]] && grep -qi '^x-disha-edge: cloudflare-render-proxy' /tmp/disha-headers; then
              ok=1
              break
            fi
            sleep 10
          done

          if [[ "$ok" != "1" ]]; then
            echo "Custom domain did not reach the current DISHA Cloudflare proxy."
            cat /tmp/disha-headers || true
            cat /tmp/disha-body || true
            exit 1
          fi

      - name: Verify production login endpoint
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          last_code="000"
          for attempt in $(seq 1 18); do
            rm -f /tmp/login-response
            code="$(curl -sS --connect-timeout 10 --max-time 20               -o /tmp/login-response               -w '%{http_code}'               -H 'content-type: application/json'               --data '{"email":"disha-smoke@example.com","password":"definitely-wrong-password-1234","rememberMe":false}'               https://disha6.6.thenitishkr.in/api/auth/login || true)"
            last_code="$code"
            if [[ "$code" == "401" ]]; then
              ok=1
              break
            fi
            sleep 10
          done

          if [[ "$ok" != "1" ]]; then
            echo "Expected authenticated DISHA endpoint to reject bad credentials with 401; got $last_code."
            cat /tmp/login-response || true
            exit 1
          fi
