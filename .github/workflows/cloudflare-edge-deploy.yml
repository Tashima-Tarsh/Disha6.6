name: disha6.6 Cloudflare Edge Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disha-cloudflare-edge
  cancel-in-progress: false

jobs:
  verify-web:
    uses: ./.github/workflows/ci.yml
  verify-python:
    uses: ./.github/workflows/python-core.yml
  verify-database:
    uses: ./.github/workflows/db-migrations.yml
  verify-security:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
  deploy:
    name: Deploy verified custom-domain transport
    needs: [verify-web, verify-python, verify-database, verify-security]
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Validate origin configuration and readiness
        env:
          DISHA_ORIGIN_URL: ${{ vars.DISHA_ORIGIN_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/check-origin.mjs
      - name: Deploy edge proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISHA_ORIGIN_URL: ${{ vars.DISHA_ORIGIN_URL }}
        run: ./node_modules/.bin/wrangler deploy --config wrangler.jsonc --var "DISHA_ORIGIN_URL:$DISHA_ORIGIN_URL"
