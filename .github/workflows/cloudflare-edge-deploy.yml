name: disha6.6 Cloudflare Edge Deploy

on:
  push:
    branches: [main]
    paths:
      - "web/cloudflare-proxy.ts"
      - "web/wrangler.jsonc"
      - ".github/workflows/cloudflare-edge-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disha-cloudflare-edge
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy custom-domain proxy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Detect Cloudflare deployment credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare API deployment credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare API deployment secrets are not configured; relying on the existing Cloudflare Git integration."
          fi

      - name: Deploy disha6.6 edge proxy
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc
