name: Fast CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint, types, audit, build, worker syntax
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Reject unresolved merge artifacts
        working-directory: .
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)( .*)?
            echo "Unresolved merge marker found."
            exit 1
          fi
          if git grep -n -E '^(main|codex/[^[:space:]]+|fix/[^[:space:]]+)
            echo "Bare branch label found in production source."
            exit 1
          fi

      - name: Check OSINT worker syntax
        run: node --check scripts/astra6-worker.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type check
        run: npm run type-check:full

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Governance and security line scan
        working-directory: .
        env:
          BASE_SHA: ${{ github.sha }}
          EVENT_NAME: workflow_dispatch
        run: node scripts/governance-check.mjs

      - name: Build
        run: npm run build
 -- web infra .github docs scripts Dockerfile .env.example; then
            echo "Unresolved merge marker found."
            exit 1
          fi
          if git grep -n -E '^(main|codex/[^[:space:]]+|fix/[^[:space:]]+)$' -- web infra .github; then
            echo "Bare branch label found in production source."
            exit 1
          fi

      - name: Check OSINT worker syntax
        run: node --check scripts/astra6-worker.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
