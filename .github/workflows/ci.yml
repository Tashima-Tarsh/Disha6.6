name: disha6.6 Product CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: disha-product-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance line check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Enforce changed-line policy
        run: node scripts/governance-check.mjs

  web:
    name: Web product verification
    needs: governance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Restore Next.js incremental build cache
        uses: actions/cache@v4
        with:
          path: |
            web/.next/cache
            web/tsconfig.tsbuildinfo
            web/tsconfig.full.tsbuildinfo
          key: ${{ runner.os }}-next-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/**/*.ts', 'web/**/*.tsx', 'web/**/*.css', 'web/next.config.js') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('web/package-lock.json') }}-
            ${{ runner.os }}-next-

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high || echo "::warning::Dependency audit advisories detected; review in continuous development"

      - name: Lint
        run: npm run lint

      - name: Type-check (strict, full surface)
        run: npm run type-check:full

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify standalone runtime artifact
        run: |
          if [ -f .next/standalone/server.js ] || [ -f .next/standalone/web/server.js ]; then
            echo "Standalone server artifact present"
          else
            echo "::error::Next standalone server.js was not produced"
            exit 1
          fi
