name: DISHA Database Migrations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disha-db-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-rehearsal:
    name: Postgres migration rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: disha_ci
          POSTGRES_USER: disha
          POSTGRES_PASSWORD: disha_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U disha -d disha_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --cpus 1
          --memory 1g

    defaults:
      run:
        working-directory: web

    env:
      DATABASE_URL: postgresql://disha:disha_ci_password@localhost:5432/disha_ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install PostGIS in pgvector rehearsal container
        run: |
          container_id="$(docker ps --filter "ancestor=pgvector/pgvector:pg16" --format '{{.ID}}' | head -n 1)"
          if [ -z "$container_id" ]; then
            echo "pgvector rehearsal container not found" >&2
            exit 1
          fi
          docker exec -u root "$container_id" bash -lc 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql-16-postgis-3'
          docker exec "$container_id" bash -lc 'test -f /usr/share/postgresql/16/extension/postgis.control'

      - name: Apply migrations
        run: npm run db:migrate

      - name: Verify migrated schema
        run: npm run db:verify-schema

      - name: Rehearse rollback
        env:
          DISHA_CONFIRM_ROLLBACK: I_UNDERSTAND_DATA_LOSS
        run: npm run db:rollback

      - name: Re-apply migrations after rollback
        run: npm run db:migrate

      - name: Verify schema after rollback rehearsal
        run: npm run db:verify-schema

  production-compose:
    name: Production Compose contract
    needs: migration-rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate production Compose configuration
        env:
          POSTGRES_PASSWORD: ci-url-safe-password
          DISHA_JWT_SECRET: ci-only-long-secret-value-for-compose-validation
          DISHA_ALLOWED_ORIGINS: https://example.org
          DISHA_PRODUCTION_URL: https://example.org
          DISHA_BRAIN_API_TOKEN: ci-only-brain-token
          DISHA_RESEARCH_RUNTIME_TOKEN: ci-only-research-token
          DISHA_WORKER_TOKEN: ci-only-worker-token
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Check PostgreSQL extensions image
        run: docker build -f infra/postgres/Dockerfile -t disha-postgres:ci .
