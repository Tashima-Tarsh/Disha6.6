name: DISHA Database Migrations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_production_migration:
        description: "Run approved production migration after CI rehearsal"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: disha-db-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-rehearsal:
    name: Postgres migration rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: disha_ci
          POSTGRES_USER: disha
          POSTGRES_PASSWORD: disha_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U disha -d disha_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --cpus 1
          --memory 1g

    defaults:
      run:
        working-directory: web

    env:
      DATABASE_URL: postgresql://disha:disha_ci_password@localhost:5432/disha_ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install PostGIS in pgvector rehearsal container
        run: |
          container_id="$(docker ps --filter "ancestor=pgvector/pgvector:pg16" --format '{{.ID}}' | head -n 1)"
          if [ -z "$container_id" ]; then
            echo "pgvector rehearsal container not found" >&2
            exit 1
          fi
          docker exec -u root "$container_id" bash -lc 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql-16-postgis-3'
          docker exec "$container_id" bash -lc 'test -f /usr/share/postgresql/16/extension/postgis.control'

      - name: Apply migrations
        run: npm run db:migrate

      - name: Verify migrated schema
        run: npm run db:verify-schema

      - name: Rehearse rollback
        env:
          DISHA_CONFIRM_ROLLBACK: I_UNDERSTAND_DATA_LOSS
        run: npm run db:rollback

      - name: Re-apply migrations after rollback
        run: npm run db:migrate

      - name: Verify schema after rollback rehearsal
        run: npm run db:verify-schema

  supabase-compatibility:
    name: Supabase Postgres 17 + PostGIS compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Select isolated Supabase database port
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import socket
          from pathlib import Path

          sock = socket.socket()
          sock.bind(("127.0.0.1", 0))
          port = sock.getsockname()[1]
          sock.close()

          config_path = Path("supabase/config.toml")
          lines = config_path.read_text().splitlines()
          in_db = False
          changed = False

          for index, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith("[") and stripped.endswith("]"):
                  in_db = stripped == "[db]"
                  continue
              if in_db and stripped.startswith("port") and "=" in line:
                  indent = line[: len(line) - len(line.lstrip())]
                  lines[index] = f"{indent}port = {port}"
                  changed = True
                  break

          if not changed:
              raise SystemExit("Could not find [db] port in supabase/config.toml")

          config_path.write_text("\n".join(lines) + "\n")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"SUPABASE_DB_PORT={port}\n")
              env.write(f"DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:{port}/postgres\n")

          print(f"Selected isolated Supabase DB port {port}")
          PY

      - name: Start Supabase Postgres
        env:
          SUPABASE_WORKDIR: ${{ github.workspace }}
        run: cd "$RUNNER_TEMP" && supabase db start

      - name: Apply Supabase extension policy
        working-directory: web
        run: npm run db:supabase-bootstrap

      - name: Apply DISHA migrations on Supabase
        working-directory: web
        run: npm run db:migrate

      - name: Verify DISHA schema on Supabase
        working-directory: web
        run: npm run db:verify-schema

      - name: Verify Supabase vector and PostGIS readiness
        working-directory: web
        run: npm run db:supabase-verify

      - name: Stop Supabase Postgres
        if: always()
        env:
          SUPABASE_WORKDIR: ${{ github.workspace }}
        run: cd "$RUNNER_TEMP" && supabase stop --no-backup

  production-migration:
    name: Approved production migration
    needs:
      - migration-rehearsal
      - supabase-compatibility
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.run_production_migration == true)
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply and verify production migrations via GitHub OIDC
        env:
          DISHA_PRODUCTION_MIGRATION_URL: https://ttkpckwejvvwjowxitrp.supabase.co/functions/v1/github-production-migrate-v3
        run: npm run db:production-oidc
